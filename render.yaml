services:
  - type: web
    name: gnps2converter-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:web && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: APP_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
